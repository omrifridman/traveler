<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traveler's Dilemma Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col text-sm">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="tracking-widest font-bold text-slate-200 text-base uppercase">Traveler's Dilemma</span>
        </div>
        <div class="flex items-center space-x-5 font-medium text-slate-400">
            {% if session.get('user_id') %}
                {% if session.get('role') != 'admin' %}
                    <a href="/dashboard" class="hover:text-indigo-400 transition">Dashboard</a>
                {% endif %}
                
                <a href="/scoreboard" class="hover:text-indigo-400 transition">Scoreboard</a>
                
                {% if session.get('role') == 'admin' %}
                    <a href="/admin" class="text-indigo-400 hover:text-indigo-300 font-bold tracking-wide">Admin Engine</a>
                {% endif %}
                
                <span class="text-slate-600">|</span>
                <span class="text-slate-200 font-semibold bg-slate-800 border border-slate-700 px-2.5 py-1 rounded">
                    {{ session.get('username') | clean_name }}
                </span>
                <a href="/logout" class="text-rose-400 hover:text-rose-300 transition font-bold">Sign Out</a>
            {% endif %}
        </div>
    </nav>
    <main class="flex-grow container mx-auto px-5 py-8 max-w-6xl">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
